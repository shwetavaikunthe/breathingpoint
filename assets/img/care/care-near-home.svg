<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" role="img" aria-label="A home at the centre with a yoga teacher and a physiotherapist within 6 km">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#f2c14e" stop-opacity=".35"/><stop offset="1" stop-color="#f2c14e" stop-opacity="0"/></radialGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6d27a"/><stop offset="1" stop-color="#e8a937"/></linearGradient>
  </defs>
  <circle cx="280" cy="225" r="205" fill="url(#glow)"/>
  <circle cx="280" cy="225" r="190" fill="none" stroke="#f2c14e" stroke-opacity=".55" stroke-width="2" stroke-dasharray="3 9" stroke-linecap="round"/>
  <circle cx="280" cy="225" r="120" fill="none" stroke="#f2c14e" stroke-opacity=".35" stroke-width="2" stroke-dasharray="3 9" stroke-linecap="round"/>
  <text x="280" y="452" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#f2c14e" fill-opacity=".85" letter-spacing="2">WITHIN 6 KM OF HOME</text>

  <!-- connecting paths -->
  <g fill="none" stroke="#f2c14e" stroke-opacity=".7" stroke-width="2.5" stroke-dasharray="2 8" stroke-linecap="round">
    <path d="M150 140 Q205 170 250 215"/><path d="M425 150 Q360 175 315 215"/>
    <path d="M155 320 Q205 285 250 250"/><path d="M420 320 Q360 290 315 250"/>
  </g>

  <!-- ground + trees -->
  <ellipse cx="280" cy="300" rx="120" ry="14" fill="#0a3836" opacity=".6"/>
  <g><rect x="196" y="262" width="6" height="30" rx="3" fill="#6b4a2b"/><circle cx="199" cy="252" r="20" fill="#6b8f4e"/><circle cx="188" cy="262" r="13" fill="#7fa561"/></g>
  <g><rect x="358" y="266" width="6" height="26" rx="3" fill="#6b4a2b"/><circle cx="361" cy="258" r="17" fill="#6b8f4e"/><circle cx="371" cy="266" r="11" fill="#7fa561"/></g>

  <!-- house -->
  <rect x="236" y="205" width="108" height="88" rx="6" fill="#fff8ee"/>
  <path d="M222 212 L290 152 L358 212 Z" fill="url(#roof)"/>
  <rect x="316" y="165" width="14" height="30" rx="2" fill="#e8a937"/>
  <rect x="274" y="244" width="32" height="49" rx="16" fill="#0e4d4a"/>
  <circle cx="300" cy="270" r="2.5" fill="#f2c14e"/>
  <rect x="246" y="222" width="22" height="22" rx="4" fill="#ffd978"/><rect x="312" y="222" width="22" height="22" rx="4" fill="#ffd978"/>
  <path d="M246 233 h22 M257 222 v22 M312 233 h22 M323 222 v22" stroke="#e8a937" stroke-width="1.5"/>
  <!-- heart over the house -->
  <path d="M290 128 c-14 -12 -30 -2 -22 12 c6 10 22 20 22 20 s16 -10 22 -20 c8 -14 -8 -24 -22 -12z" fill="#e4436b"/>

  <!-- pin: yoga (lotus) -->
  <g transform="translate(112 118)">
    <circle cx="0" cy="0" r="30" fill="#fff8ee" stroke="#f2c14e" stroke-width="3"/>
    <g fill="#e07a1f"><path d="M0 14 C-7 8 -7 -4 0 -12 C7 -4 7 8 0 14Z"/><path d="M-3 14 C-14 12 -20 4 -17 -4 C-9 -2 -4 4 -3 14Z" fill="#0e4d4a"/><path d="M3 14 C14 12 20 4 17 -4 C9 -2 4 4 3 14Z" fill="#0e4d4a"/></g>
  </g>
  <!-- pin: physio (cross) -->
  <g transform="translate(448 128)">
    <circle cx="0" cy="0" r="30" fill="#fff8ee" stroke="#f2c14e" stroke-width="3"/>
    <rect x="-5.5" y="-16" width="11" height="32" rx="3" fill="#0e4d4a"/><rect x="-16" y="-5.5" width="32" height="11" rx="3" fill="#0e4d4a"/>
    <circle cx="0" cy="0" r="4" fill="#e4436b"/>
  </g>
  <!-- pin: yoga #2 (person) -->
  <g transform="translate(130 330)">
    <circle cx="0" cy="0" r="26" fill="#fff8ee" stroke="#f2c14e" stroke-width="3"/>
    <circle cx="0" cy="-10" r="5" fill="#e07a1f"/><path d="M0 -4 V6 M-11 0 Q0 4 11 0 M0 6 L-8 15 M0 6 L8 15" stroke="#0e4d4a" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>
  <!-- pin: physio #2 (stethoscope-ish heart-pulse) -->
  <g transform="translate(438 334)">
    <circle cx="0" cy="0" r="26" fill="#fff8ee" stroke="#f2c14e" stroke-width="3"/>
    <path d="M-15 2 H-6 L-2 -9 L3 11 L7 2 H15" stroke="#e4436b" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>
