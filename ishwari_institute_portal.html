<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ISHWARI — The Institute for Conscious Living | Course Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<style>
  :root{
    --ink:#26311D;
    --ink-soft:#5C6B54;
    --paper:#FBF8F6;
    --panel:#FFFFFF;
    --line:#E5DFD1;
    --gold:#C08A3E;
    --gold-deep:#9C6D2A;
    --green:#3F5820;
    --green-deep:#2E4118;
    --rust:#A3432B;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--paper);color:var(--ink);font-family:'Poppins', sans-serif;font-size:15px;line-height:1.55;}
  h1,h2,h3,.serif{font-family:'Cormorant Garamond', serif;font-weight:600;letter-spacing:0.2px;margin:0;}
  code{background:#F0EEE4;padding:1px 5px;border-radius:2px;font-size:12.5px;}
  #app{min-height:100vh;}
  .wrap{max-width:1080px;margin:0 auto;padding:0 24px;}
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;font-size:14px;}
  fieldset{border:none;padding:0;margin:0 0 22px;}
  legend{font-family:'Cormorant Garamond',serif;font-size:17px;font-weight:600;color:var(--green-deep);padding:0 0 8px;border-bottom:1px solid var(--line);width:100%;margin-bottom:14px;}

  /* ---------- top bar ---------- */
  .topbar{border-bottom:1px solid var(--line);background:var(--panel);}
  .topbar-inner{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;max-width:1080px;margin:0 auto;gap:16px;flex-wrap:wrap;}
  .brand{display:flex;align-items:center;gap:12px;cursor:pointer;}
  .brand img{height:46px;width:auto;display:block;}
  .brand-divider{width:1px;height:34px;background:var(--line);}
  .brand-sub{display:flex;flex-direction:column;align-items:flex-start;gap:2px;}
  .brand-sub-label{font-size:10px;color:var(--ink-soft);letter-spacing:.4px;text-transform:uppercase;}
  .brand-sub img.bp-logo{height:20px;width:auto;display:block;}
  .topbar-actions{display:flex;gap:10px;align-items:center;}

  /* ---------- buttons ---------- */
  .btn{border-radius:2px;border:1px solid var(--green-deep);background:var(--green-deep);color:#fff;padding:9px 16px;font-size:13.5px;font-weight:500;transition:opacity .15s;}
  .btn:hover{opacity:.85;}
  .btn.secondary{background:transparent;color:var(--ink);border:1px solid var(--line);}
  .btn.secondary:hover{border-color:var(--ink);}
  .btn.gold{background:var(--gold-deep);border-color:var(--gold-deep);color:#fff;}
  .btn.green{background:var(--green-deep);border-color:var(--green-deep);color:#fff;}
  .btn.rust{background:transparent;border-color:var(--rust);color:var(--rust);}
  .btn.rust:hover{background:var(--rust);color:#fff;}
  .btn.small{padding:6px 11px;font-size:12.5px;}
  .btn:disabled{opacity:.4;cursor:not-allowed;}

  /* ---------- landing ---------- */
  .hero{padding:56px 0 36px;}
  .hero .eyebrow{color:var(--gold-deep);font-size:13px;letter-spacing:1px;font-weight:500;}
  .hero h1{font-size:36px;max-width:620px;margin-top:8px;}
  .hero p.lede{color:var(--ink-soft);font-size:16px;max-width:500px;margin-top:14px;}
  .hero-actions{display:flex;gap:12px;margin-top:28px;flex-wrap:wrap;}

  .section-label{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--ink-soft);margin-bottom:14px;letter-spacing:.3px;}
  .section-label .rule{flex:1;height:1px;background:var(--line);}

  .course-row{display:flex;justify-content:space-between;align-items:center;padding:16px 0;border-bottom:1px solid var(--line);gap:16px;}
  .course-row:last-child{border-bottom:none;}
  .course-name{font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:600;}
  .course-desc{color:var(--ink-soft);font-size:13.5px;margin-top:3px;max-width:520px;}
  .course-dates{font-size:12.5px;color:var(--ink-soft);white-space:nowrap;}
  .badge{display:inline-block;padding:3px 9px;border-radius:2px;font-size:11px;letter-spacing:.3px;border:1px solid transparent;}
  .badge.upcoming{background:#F1E4CC;color:var(--gold-deep);border-color:#E1C793;}
  .badge.ongoing{background:#E6ECDD;color:var(--green-deep);border-color:#CBDAB6;}
  .badge.completed{background:#F0EEE4;color:var(--ink-soft);border-color:var(--line);}
  .badge.inreview{background:#F1E4CC;color:var(--gold-deep);border-color:#E1C793;}
  .badge.pendingstatus{background:#F3E3DF;color:var(--rust);border-color:#E3BEB3;}
  .badge.activestatus{background:#E6ECDD;color:var(--green-deep);border-color:#CBDAB6;}

  .empty{padding:36px 0;color:var(--ink-soft);font-size:14px;text-align:left;border-bottom:1px solid var(--line);}

  /* ---------- panels / forms ---------- */
  .panel{background:var(--panel);border:1px solid var(--line);padding:26px 28px;margin-bottom:24px;}
  .panel.accent{border-left:3px solid var(--gold);}
  .panel h2{font-size:20px;margin-bottom:4px;}
  .panel .sub{color:var(--ink-soft);font-size:13px;margin-bottom:18px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12.5px;color:var(--ink-soft);margin-bottom:5px;}
  .field input,.field select,.field textarea{width:100%;padding:9px 11px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:2px;}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--gold);}
  .radio-row{display:flex;gap:18px;flex-wrap:wrap;align-items:center;padding:4px 0;}
  .radio-row label{display:flex;align-items:center;gap:6px;font-size:13.5px;color:var(--ink);}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
  @media (max-width:640px){.row2,.row3{grid-template-columns:1fr;}}
  .msg{padding:10px 13px;border-radius:2px;font-size:13.5px;margin-bottom:16px;}
  .msg.ok{background:#E6ECDD;color:var(--green-deep);}
  .msg.err{background:#F3E3DF;color:var(--rust);}
  .terms-box{max-height:120px;overflow:auto;border:1px solid var(--line);padding:12px 14px;font-size:12.5px;color:var(--ink-soft);background:#FCFBF8;margin-bottom:10px;}
  .terms-box li{margin-bottom:6px;}
  .agree-row{display:flex;align-items:flex-start;gap:8px;font-size:13px;}
  .agree-row input{width:auto;margin-top:3px;}

  /* ---------- app shell (logged in) ---------- */
  .shell{display:flex;max-width:1080px;margin:0 auto;min-height:calc(100vh - 74px);}
  .nav{width:200px;flex:none;border-right:1px solid var(--line);padding:26px 18px;}
  .nav .navlabel{font-size:11px;color:var(--ink-soft);margin-bottom:12px;letter-spacing:.3px;line-height:1.5;}
  .nav button{display:block;width:100%;text-align:left;background:none;border:none;padding:9px 8px;font-size:13.5px;color:var(--ink-soft);border-radius:2px;margin-bottom:2px;}
  .nav button:hover{background:#F0EEE4;color:var(--ink);}
  .nav button.active{background:var(--green-deep);color:#fff;}
  .main{flex:1;padding:30px 32px;min-width:0;}

  table{width:100%;border-collapse:collapse;}
  th{text-align:left;font-size:11.5px;color:var(--ink-soft);font-weight:500;padding:8px 10px;border-bottom:1px solid var(--ink);letter-spacing:.2px;}
  td{padding:11px 10px;border-bottom:1px solid var(--line);font-size:13.5px;vertical-align:middle;}
  tr:last-child td{border-bottom:none;}

  .id-chip{font-family:'Cormorant Garamond',serif;background:#F0EEE4;padding:2px 8px;border-radius:2px;font-size:13px;font-weight:600;}

  .certificate{border:2px solid var(--gold);padding:2px;background:#fff;}
  .certificate-inner{border:1px solid var(--gold);padding:40px 36px;text-align:center;}
  .certificate-inner img{height:50px;margin-bottom:10px;}
  .certificate-inner .cert-eyebrow{font-size:12px;color:var(--ink-soft);letter-spacing:1px;}
  .certificate-inner .cert-name{font-family:'Cormorant Garamond',serif;font-size:30px;margin:14px 0 6px;color:var(--green-deep);}
  .certificate-inner .cert-course{font-size:16px;margin:10px 0;}
  .certificate-inner .cert-course b{font-family:'Cormorant Garamond',serif;font-weight:600;}
  .certificate-inner .cert-meta{font-size:12.5px;color:var(--ink-soft);margin-top:22px;}
  .certificate-inner .cert-rule{width:70px;height:2px;background:var(--gold);margin:18px auto;}

  .pagination{display:flex;justify-content:center;gap:8px;margin-top:20px;flex-wrap:wrap;}
  .file-btn{position:relative;overflow:hidden;display:inline-block;}
  .file-btn input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;}

  .modal-backdrop{position:fixed;inset:0;background:rgba(38,49,29,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;overflow:auto;}
  .modal-box{background:#fff;border:1px solid var(--line);max-width:520px;width:100%;padding:26px 28px;max-height:85vh;overflow:auto;}
  .profile-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 18px;font-size:13.5px;margin-top:14px;}
  .profile-grid label{display:block;font-size:11px;color:var(--ink-soft);margin-bottom:2px;}

  @media print{
    body *{visibility:hidden;}
    #print-area, #print-area *{visibility:visible;}
    #print-area{position:absolute;top:0;left:0;width:100%;padding:40px;}
  }

  .footer-note{color:var(--ink-soft);font-size:12px;padding:14px 0 30px;text-align:center;}
  .footer-tagline{text-align:center;font-family:'Cormorant Garamond',serif;font-style:italic;color:var(--gold-deep);font-size:15px;padding-top:10px;}
</style>
</head>

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const FS_COLLECTION = "ishwari_institute"; // Firestore collection holding one doc per data key

async function loadAll(){
  const keys = ["courses","students","enrollments","results","settings"];
  for(const k of keys){
    try{
      const snap = await db.collection(FS_COLLECTION).doc(k).get();
      if(snap.exists){
        const data = snap.data();
        if(data && data.items !== undefined) state[k] = data.items;
      }
    }catch(e){
      console.error("Firestore load error for", k, e);
      flash("err", "Could not connect to the database. Check your internet connection and reload.");
    }
  }
}
async function persist(key){
  try{
    await db.collection(FS_COLLECTION).doc(key).set({
      items: state[key],
      updatedAt: new Date().toISOString()
    });
  }catch(e){
    console.error("Firestore save error for", key, e);
    flash("err", "Could not save to the database — check your internet connection and try again.");
  }
}

/* Lightweight, non-destructive error display for long forms — avoids wiping
   entered field values the way a full render() would (used by registration & course forms). */
function localError(elementId, text){
  const el = document.getElementById(elementId);
  if(el) el.innerHTML = text ? `<div class="msg err">${text}</div>` : "";
}

function todayStart(){ const d = new Date(); d.setHours(0,0,0,0); return d; }
function parseDate(s){ return new Date(s+"T00:00:00"); }
function fmtDate(s){ if(!s) return "—"; return parseDate(s).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}); }
function fmtMoney(n){ n = Number(n)||0; return n>0 ? "₹" + n.toLocaleString('en-IN') : "Free"; }
function calcAge(dobStr){
  if(!dobStr) return null;
  const dob = parseDate(dobStr);
  const today = new Date();
  let age = today.getFullYear() - dob.getFullYear();
  const m = today.getMonth() - dob.getMonth();
  if(m < 0 || (m===0 && today.getDate() < dob.getDate())) age--;
  return age;
}
function courseStatus(course){
  const t = todayStart();
  const start = parseDate(course.startDate);
  const end = parseDate(course.endDate);
  if(start > t) return "upcoming";
  if(end < t) return "completed";
  return "ongoing";
}
function badge(status){
  const label = status === "upcoming" ? "Upcoming" : status === "ongoing" ? "Ongoing" : "Completed";
  return `<span class="badge ${status}">${label}</span>`;
}
function courseById(id){ return state.courses.find(c=>c.id===id); }
function studentById(id){ return state.students.find(s=>s.id===id); }
function nextId(prefix, list){ return prefix + String(list.length + 1).padStart(4,'0'); }
function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}

/* ---------- Email (EmailJS, sent from the browser, optional) ---------- */
function emailReady(){
  const s = state.settings;
  return !!(s && s.serviceId && s.templateId && s.publicKey && typeof emailjs !== "undefined");
}
async function sendEmail(toEmail, toName, subject, message){
  if(!emailReady()) return false;
  try{
    if(!window.__emailjsInit){ emailjs.init({ publicKey: state.settings.publicKey }); window.__emailjsInit = true; }
    await emailjs.send(state.settings.serviceId, state.settings.templateId, {
      to_email: toEmail, to_name: toName, subject, message, from_email: NOTIFY_FROM_EMAIL
    });
    return true;
  }catch(e){ console.error("email send failed", e); return false; }
}

/* ---------- Excel export (SheetJS) ---------- */
function exportToExcel(){
  const studentRows = state.students.map(s=>({
    "Student ID": s.id, "Full Name": s.name, "Date of Birth": s.dob, "Age": s.age, "Gender": s.gender,
    "Occupation": s.occupation, "Mobile": s.mobile, "Email": s.email, "Address": s.address,
    "Education": s.education, "Prior Yoga Knowledge": s.priorYoga==="yes" ? "Yes" : "No",
    "Prior Yoga Detail": s.priorYogaDetail||"", "Preferred Exam Language": s.examLanguage,
    "Medical Condition": s.medical==="yes" ? "Yes" : "No", "Medical Detail": s.medicalDetail||"",
    "Statement of Purpose": s.purpose, "Terms Agreed": s.agreedAt ? "Yes" : "No",
    "Registered On": s.registeredAt,
  }));
  const enrollRows = state.enrollments.map(e=>{
    const st = studentById(e.studentId), c = courseById(e.courseId);
    return {
      "Registration ID": e.id, "Student ID": e.studentId, "Student Name": st?st.name:"",
      "Course": c?c.name:"", "Fee": e.fee, "Enrollment Status": e.status,
      "Status Updated": e.statusUpdatedAt||"", "Enrolled On": e.enrolledAt,
    };
  });
  const resultRows = state.results.map(r=>{
    const e = state.enrollments.find(x=>x.id===r.enrollmentId);
    const st = e && studentById(e.studentId), c = e && courseById(e.courseId);
    return {
      "Registration ID": r.enrollmentId, "Student Name": st?st.name:"", "Course": c?c.name:"",
      "Score": r.score, "Grade": r.grade, "Result": r.pass?"Pass":"Fail",
      "Certificate ID": r.certificateId, "Published On": r.publishedAt,
    };
  });
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(studentRows), "Registrations");
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(enrollRows), "Enrollments");
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(resultRows), "Results");
  XLSX.writeFile(wb, "ishwari-institute-data-" + new Date().toISOString().slice(0,10) + ".xlsx");
}

function render(){
  const app = document.getElementById("app");
  let html = "";
  if(state.view === "landing") html = renderLanding();
  else if(state.view === "catalog") html = renderCatalog();
  else if(state.view === "adminLogin") html = renderAdminLogin();
  else if(state.view === "adminDashboard") html = renderAdminShell();
  else if(state.view === "studentRegister") html = renderStudentRegister();
  else if(state.view === "studentLogin") html = renderStudentLogin();
  else if(state.view === "studentDashboard") html = renderStudentShell();
  app.innerHTML = html;
  window.scrollTo(0,0);
}

/* ---------- Public catalog (search + filter + pagination) ---------- */
function renderCatalog(){
  const all = state.courses.filter(c=>courseStatus(c)==="upcoming");
  const categories = [...new Set(all.map(c=>c.category).filter(Boolean))].sort();
  const filtered = all.filter(c=>{
    const q = state.catalogSearch.trim().toLowerCase();
    const matchesSearch = !q || (c.name+" "+(c.description||"")).toLowerCase().includes(q);
    const matchesCategory = !state.catalogCategory || c.category === state.catalogCategory;
    return matchesSearch && matchesCategory;
  }).sort((a,b)=>parseDate(a.startDate)-parseDate(b.startDate));

  const totalPages = Math.max(1, Math.ceil(filtered.length / CATALOG_PAGE_SIZE));
  const page = Math.min(state.catalogPage, totalPages);
  const pageItems = filtered.slice((page-1)*CATALOG_PAGE_SIZE, page*CATALOG_PAGE_SIZE);

  return `
    ${topbar(false)}
    <div class="wrap" style="padding-top:36px;">
      <div class="section-label"><span>COURSE CATALOG</span><span class="rule"></span></div>
      <div class="row2">

        <div class="field">
          <select onchange="state.catalogCategory=this.value; state.catalogPage=1; render();">
            <option value="">All categories</option>
            ${categories.map(cat=>`<option value="${escapeHtml(cat)}" ${cat===state.catalogCategory?"selected":""}>${escapeHtml(cat)}</option>`).join("")}
          </select>
        </div>
      </div>
      ${pageItems.length===0 ? `<div class="empty">No courses match your search.</div>` :
        pageItems.map(c=>`
          <div class="course-row">
            <div>
              <div class="course-name">${escapeHtml(c.name)}</div>
              ${c.category ? `<div class="course-dates">${escapeHtml(c.category)}</div>` : ""}
              ${c.description ? `<div class="course-desc">${escapeHtml(c.description)}</div>` : ""}
            </div>
            <div style="text-align:right">
              <div class="course-name" style="font-size:14px;">${fmtMoney(c.fee)}</div>
              <div class="course-dates" style="margin-top:6px;">Starts ${fmtDate(c.startDate)}</div>
            </div>
          </div>
        `).join("")}
      ${totalPages > 1 ? `<div class="pagination">
        ${Array.from({length: totalPages}, (_,i)=>i+1).map(p=>`<button class="btn small ${p===page?'':'secondary'}" onclick="state.catalogPage=${p}; render();">${p}</button>`).join("")}
      </div>` : ""}
      <div style="text-align:center;margin-top:26px;">
        <button class="btn secondary" onclick="goLanding()">&larr; Back to home</button>

}

function addCourse(){
  const name = document.getElementById("cName").value.trim();
  const desc = document.getElementById("cDesc").value.trim();
  const start = document.getElementById("cStart").value;
  const end = document.getElementById("cEnd").value;
  const category = document.getElementById("cCategory").value.trim();
  const fee = Number(document.getElementById("cFee").value) || 0;
  localError("courseMsg", null);
  if(!name || !start || !end){ localError("courseMsg","Course name, start date and end date are required."); return; }
  if(parseDate(end) < parseDate(start)){ localError("courseMsg","End date can't be before the start date."); return; }
  if(fee < 0){ localError("courseMsg","Fee can't be negative."); return; }
  const course = { id: nextId("CRS", state.courses), name, description:desc, category, fee, startDate:start, endDate:end };
  state.courses.push(course);
  persist("courses");
  flash("ok", `"${name}" has been published.`);
}

function saveCourseEdit(courseId){
  const c = courseById(courseId);
  if(!c) return;
  const name = document.getElementById("ecName").value.trim();
  const desc = document.getElementById("ecDesc").value.trim();
  const start = document.getElementById("ecStart").value;
  const end = document.getElementById("ecEnd").value;
  const category = document.getElementById("ecCategory").value.trim();
  const fee = Number(document.getElementById("ecFee").value) || 0;
  if(!name || !start || !end){ localError("editCourseMsg","Course name, start date and end date are required."); return; }
  if(parseDate(end) < parseDate(start)){ localError("editCourseMsg","End date can't be before the start date."); return; }
  if(fee < 0){ localError("editCourseMsg","Fee can't be negative."); return; }
  c.name = name; c.description = desc; c.startDate = start; c.endDate = end; c.category = category; c.fee = fee;

  flash("ok", `"${name}" has been updated.`);

function setEnrollmentStatus(enrollmentId, newStatus){
  const e = state.enrollments.find(x=>x.id===enrollmentId);
  if(!e) return;
  e.status = newStatus;
  e.statusUpdatedAt = new Date().toISOString();
  persist("enrollments");
  flash("ok", `Status updated to ${newStatus}.`);
  const st = studentById(e.studentId), c = courseById(e.courseId);
  if(!st || !c) return;
  if(newStatus === "Active"){
    sendEmail(st.email, st.name, "Your enrollment is now Active",
      `Good news, ${st.name} — your enrollment for ${c.name} (Registration ID ${e.id}) is now Active. We look forward to having you in the course.`).catch(()=>{});
  } else if(newStatus === "Pending"){
    sendEmail(st.email, st.name, "Payment confirmation pending",
      `Hi ${st.name}, we've received your registration for ${c.name} (Registration ID ${e.id}), but payment confirmation is still pending. Please complete your payment so we can activate your enrollment.`).catch(()=>{});
  }
}

function publishResult(enrollmentId){
  const score = document.getElementById("score-"+enrollmentId).value;
  const grade = document.getElementById("grade-"+enrollmentId).value.trim();
  const pass = document.getElementById("pass-"+enrollmentId).value === "pass";
  if(score === ""){ flash("err","Enter a score before publishing."); return; }
  upsertResult(enrollmentId, score, grade, pass);
  persist("results");
  flash("ok","Result published. The student can now view it.");
  const e = state.enrollments.find(x=>x.id===enrollmentId);
  const st = studentById(e.studentId), c = courseById(e.courseId);
  if(st && c){
    sendEmail(st.email, st.name, "Your result is published",
      `Your result for ${c.name}: Score ${score}${grade?", Grade "+grade:""} — ${pass?"Pass":"Fail"}.`).catch(()=>{});
  }
}
function upsertResult(enrollmentId, score, grade, pass){
  let result = state.results.find(r=>r.enrollmentId===enrollmentId);
  if(result){
    result.score = score; result.grade = grade; result.pass = pass; result.publishedAt = new Date().toISOString();
  } else {
    result = { id: nextId("RES", state.results), enrollmentId, score, grade, pass,
      certificateId: "CERT-" + enrollmentId, publishedAt: new Date().toISOString() };
    state.results.push(result);
  }
  return result;
}

/* ---------- CSV helpers (bulk results) ---------- */
function csvEscape(v){
  v = String(v === undefined || v === null ? "" : v);
  if(/[",\n]/.test(v)) return '"' + v.replace(/"/g,'""') + '"';
  return v;
}
function courseRosterCSV(courseId){
  const roster = state.enrollments.filter(e=>e.courseId===courseId);
  const rows = [["RegistrationID","StudentName","Score","Grade","Result"]];
  roster.forEach(e=>{
    const st = studentById(e.studentId);
    const r = state.results.find(x=>x.enrollmentId===e.id);
    rows.push([e.id, st?st.name:"", r?r.score:"", r?r.grade:"", r?(r.pass?"Pass":"Fail"):""]);
  });
  return rows.map(r=>r.map(csvEscape).join(",")).join("\n");
}
function downloadCSV(filename, content){
  const blob = new Blob([content], {type:"text/csv"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function downloadRosterTemplate(courseId){
  const c = courseById(courseId);
  downloadCSV(`roster-${c?c.name.replace(/[^a-z0-9]+/gi,'-'):courseId}.csv`, courseRosterCSV(courseId));
}
function parseCSV(text){
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for(let i=0;i<text.length;i++){
    const ch = text[i];
    if(inQuotes){
      if(ch === '"'){
        if(text[i+1] === '"'){ field += '"'; i++; } else { inQuotes = false; }
      } else field += ch;
    } else {
      if(ch === '"') inQuotes = true;
      else if(ch === ','){ row.push(field); field = ""; }
      else if(ch === '\n' || ch === '\r'){
        if(ch === '\r' && text[i+1] === '\n') i++;
        row.push(field); rows.push(row); row = []; field = "";
      } else field += ch;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => !(r.length===1 && r[0]===""));
}
function processResultsCSV(courseId, text){
  const rows = parseCSV(text);
  if(rows.length===0) return { updated:0, notFound:[], error:"The file appears to be empty." };
  const header = rows[0].map(h=>h.trim().toLowerCase());
  const idIdx = header.indexOf("registrationid");
  const scoreIdx = header.indexOf("score");
  const gradeIdx = header.indexOf("grade");
  const resultIdx = header.indexOf("result");
  if(idIdx === -1 || scoreIdx === -1){
    return { updated:0, notFound:[], error:"CSV must include RegistrationID and Score columns." };
  }
  let updated = 0; const notFound = []; const touched = [];
  for(let i=1;i<rows.length;i++){
    const r = rows[i];
    if(!r[idIdx]) continue;
    const regId = r[idIdx].trim();
    const enrollment = state.enrollments.find(e=>e.id===regId && e.courseId===courseId);
    if(!enrollment){ notFound.push(regId); continue; }
    const score = (r[scoreIdx]||"").trim();
    if(score === "") continue;
    const grade = gradeIdx>-1 ? (r[gradeIdx]||"").trim() : "";
    const passVal = resultIdx>-1 ? (r[resultIdx]||"").trim().toLowerCase() : "";
    const pass = passVal ? passVal.startsWith("p") : (Number(score) >= 40);
    upsertResult(enrollment.id, score, grade, pass);
    touched.push(enrollment.id);
    updated++;
  }
  return { updated, notFound, touched };
}
function onBulkFileSelected(evt){
  const file = evt.target.files && evt.target.files[0];
  if(!file) return;
  const courseId = state.resultCourseId;
  const reader = new FileReader();
  reader.onload = function(e){
    const outcome = processResultsCSV(courseId, e.target.result);
    if(outcome.error){ flash("err", outcome.error); return; }
    persist("results");
    state.bulkUploadSummary = { updated: outcome.updated, notFound: outcome.notFound };
    render();
    (outcome.touched||[]).forEach(enrollmentId=>{
      const en = state.enrollments.find(x=>x.id===enrollmentId);
      const r = state.results.find(x=>x.enrollmentId===enrollmentId);
      const st = en && studentById(en.studentId), c = en && courseById(en.courseId);
      if(st && c && r) sendEmail(st.email, st.name, "Your result is published",
        `Your result for ${c.name}: Score ${r.score}${r.grade?", Grade "+r.grade:""} — ${r.pass?"Pass":"Fail"}.`).catch(()=>{});
    });
  };
  reader.readAsText(file);
}

}

function renderStudentResults(){
  const s = state.currentStudent;
  const mine = state.enrollments.filter(e=>e.studentId===s.id);
  const withResults = mine.map(e=>({e, r: state.results.find(r=>r.enrollmentId===e.id)})).filter(x=>x.r);
  return `
    <div class="section-label"><span>RESULTS &amp; CERTIFICATES</span><span class="rule"></span></div>
    ${withResults.length===0 ? `<div class="empty">No results have been published for you yet.</div>` : `
    <table>
      <tr><th>Course</th><th>Score</th><th>Grade</th><th>Result</th><th></th></tr>
      ${withResults.map(({e,r})=>{
        const c = courseById(e.courseId);
        return `<tr>
          <td>${c?escapeHtml(c.name):"—"}</td>
          <td>${r.score}</td>
          <td>${r.grade||"—"}</td>
          <td>${r.pass ? `<span class="badge ongoing">Pass</span>` : `<span class="badge completed">Fail</span>`}</td>
          <td>${r.pass ? `<button class="btn small gold" onclick="viewCertificate('${e.id}')">View certificate</button>` : ""}</td>
        </tr>`;
      }).join("")}
    </table>`}
  `;
}
function viewCertificate(enrollmentId){
  const e = state.enrollments.find(x=>x.id===enrollmentId);
  const r = state.results.find(x=>x.enrollmentId===enrollmentId);
  const c = courseById(e.courseId);
  const s = state.currentStudent;
  openModal(`
    <div class="modal-backdrop" onclick="if(event.target===this) closeModal();">
      <div style="max-width:640px;width:100%;">
        <div id="print-area" class="certificate">
          <div class="certificate-inner">
            <img src="${LOGO_SRC}" alt="ISHWARI">
            <div class="cert-eyebrow" style="display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:2px;">
              <span>under</span><img src="${BP_LOGO_SRC}" alt="Breathing Point" style="height:16px;width:auto;">
            </div>
            <div class="cert-eyebrow">ISHWARI — THE INSTITUTE FOR CONSCIOUS LIVING · CERTIFICATE OF COMPLETION</div>
            <div class="cert-rule"></div>
            <div class="cert-name">${escapeHtml(s.name)}</div>
            <div class="cert-course">has successfully completed<br><b>${c?escapeHtml(c.name):""}</b></div>
            <div class="cert-rule"></div>
            <div class="cert-meta">
              Grade: ${r.grade||"—"} &nbsp;·&nbsp; Score: ${r.score} &nbsp;·&nbsp; Certificate ID: ${r.certificateId}<br>
              Issued ${fmtDate(r.publishedAt.slice(0,10))}
            </div>
          </div>
        </div>
        <div style="display:flex;justify-content:center;gap:10px;margin-top:16px;">
          <button class="btn green" onclick="window.print()">Print / save as PDF</button>
          <button class="btn secondary" onclick="closeModal()">Close</button>
        </div>
      </div>
    </div>
  `);
}

/* ---------- shared ---------- */
function logout(){
  state.role = null; state.currentStudent = null; state.view = "landing"; state.message = null;
  render();
}

/* ============================= INIT ============================= */
(async function init(){
  document.getElementById("app").innerHTML = `<div class="wrap" style="padding-top:80px;color:#5C6B54;">Loading…</div>`;
  await loadAll();
  render();
})();
</script>
</body>
</html>
